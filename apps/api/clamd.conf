# ClamAV Daemon Configuration for FileDuck Scanner
# Optimized for scanning large files (up to 2GB)

# TCP socket for communication
TCPSocket 3310
TCPAddr 127.0.0.1

# Logging
LogFile /var/log/clamav/clamd.log
LogTime yes
LogFileMaxSize 10M
LogRotate yes
LogVerbose no

# Daemon settings
PidFile /var/run/clamav/clamd.pid
DatabaseDirectory /var/lib/clamav

# Performance settings
MaxThreads 10
MaxConnectionQueueLength 30
MaxDirectoryRecursion 20

# File size limits (2GB max file size)
MaxFileSize 2000M
MaxScanSize 2000M
StreamMaxLength 2000M

# Scan time limits (10 minutes max)
MaxScanTime 600000

# Archive scanning
ScanArchive yes
ArchiveBlockEncrypted no

# Detection settings
DetectPUA yes
AlgorithmicDetection yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanHTML yes
ScanMail yes

# Disable limits that might prevent scanning large files
MaxEmbeddedPE 100M
MaxHTMLNormalize 100M
MaxHTMLNoTags 100M
MaxScriptNormalize 100M
MaxZipTypeRcg 100M

# User and permissions
User clamav
AllowSupplementaryGroups yes

# Exit on out of memory
ExitOnOOM yes

